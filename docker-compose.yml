services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: winnow-postgres
    environment:
      POSTGRES_USER: winnow
      POSTGRES_PASSWORD: winnow_dev_local_only
      POSTGRES_DB: winnow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U winnow -d winnow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
